logging:
  level: debug
  flushLevel: warn
  loggerName: szx_admin
  pattern: "[%Y-%m-%d %H:%M:%S.%e] [%5t|%5P] [%^%-4l%$] [%n] %v"
  filePath: "logs/szx_admin.log"
  maxFileSize: 10485760
  maxFiles: 10
  truncate: false
  console: true

server:
  host: 127.0.0.1
  port: 8080
  workerThreads: 0
  maxRequestBodyBytes: 1048576
  maxConnections: 1024
  apiPrefix: /api/v1
  accessLog: false
  staticRoot: web
  staticHomePage: index.html
  spaFallback: true

database:
  host: 127.0.0.1
  port: 3306
  database: szx_admin
  username: root
  password: "P@ssword1234"
  poolSize: 8
  connectTimeoutSeconds: 5
  lockWaitTimeoutSeconds: 5
